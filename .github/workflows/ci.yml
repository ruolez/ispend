name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly browser suites against a fresh stack
  workflow_dispatch:

jobs:
  backend:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt ruff
      - name: ruff
        run: ruff check backend
      - name: unit tests
        working-directory: backend
        run: python -m unittest discover -s tests

  frontend:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

  api-e2e:
    name: API suite against the compose stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: start the stack
        run: |
          printf 'SECRET_KEY=ci-secret-key\nPOSTGRES_PASSWORD=ci-postgres\nADMIN_INITIAL_PASSWORD=admin\n' > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:5559/api/health && break; sleep 2; done
      - run: pip install pytest requests
      - name: API suite
        run: pytest qa/e2e/test_api.py -q -p no:cacheprovider
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200

  browser-e2e:
    name: Nightly Playwright suites
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: start the stack
        run: |
          printf 'SECRET_KEY=ci-secret-key\nPOSTGRES_PASSWORD=ci-postgres\nADMIN_INITIAL_PASSWORD=admin\n' > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:5559/api/health && break; sleep 2; done
          # the suites expect the qa_tester persona (see qa/CONTEXT.md)
          python - <<'PY'
          import requests
          s = requests.Session()
          assert s.post("http://localhost:5559/api/auth/login", json={"username": "admin", "password": "admin"}).ok
          s.post("http://localhost:5559/api/users", json={"username": "qa_tester", "password": "qa-tester-pass1", "role": "user"})
          PY
      - run: pip install pytest requests playwright && playwright install --with-deps chromium
      - name: flows
        run: pytest qa/e2e/test_flows.py -q -p no:cacheprovider
      - name: smoke
        run: pytest qa/e2e/test_smoke.py -q -p no:cacheprovider
      - name: phone parity, static CSS rules, report snapshots
        run: pytest qa/e2e/test_phone.py qa/e2e/test_css_audit.py qa/e2e/test_report_snapshot.py -q -p no:cacheprovider
      - name: a11y scan
        run: python qa/e2e/a11y_scan.py --quick
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200
