# HTTPS overlay, enabled by install.sh through COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ssl.yml
# nginx serves the generated nginx/nginx.ssl.conf, the host's Let's Encrypt
# certificates (read-only) and the ACME webroot used for renewals.
services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.ssl.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Compose replaces this list rather than merging it, so the backup volume has to be
      # repeated here or X-Accel downloads break on exactly the HTTPS installs that matter.
      - statements:/protected:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
