# Local development overlay. Restores the live-code bind mount and gunicorn
# --reload so backend edits take effect without a rebuild. NOT auto-loaded:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    volumes:
      - ./backend:/app
      - statements:/data/statements
    # --reload cannot be combined with --preload; run a single worker.
    command:
      - sh
      - "-c"
      - "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 1800 --graceful-timeout 600 --reload 'app:create_app()'"
    deploy:
      resources:
        limits:
          memory: 1536M
