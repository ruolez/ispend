<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f8">
  <title>Create your account · iSpend</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-mark" id="login-mark"></div>
      <h1>Create your account</h1>
      <div class="login-sub">Start your free trial. No card needed.</div>
      <div class="notice notice-info login-notice" id="login-notice" role="status" hidden></div>
      <div class="error-box login-error" id="login-error" role="alert"></div>
      <div id="page-body"></div>
      <div class="login-foot"><span><a href="/login.html">Back to sign in</a></span>
        <button type="button" class="btn btn-ghost btn-xs" id="login-theme">Theme</button></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/_authpage.js"></script>
  <script src="/js/pages/signup.js"></script>
</body>
</html>
