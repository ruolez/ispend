<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>You’re offline · iSpend</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iSpend">
  <!-- Self-contained on purpose: the service worker precaches only this file, so it may not
       depend on any stylesheet, script or font that would need to be cached with it. -->
  <style>
    /* Mirrors css/tokens.css (light + dark blocks). */
    :root { --bg: #f5f6f8; --surface: #ffffff; --text-1: #111827; --text-2: #4b5563; --border: #e5e8ee; --accent: #3f5fe0; --accent-fg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0e13; --surface: #161a22; --text-1: #f1f3f7; --text-2: #b3bbc8; --border: #262c38; --accent: #7c94ff; --accent-fg: #0c0e13; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body { background: var(--bg); color: var(--text-1); font: 400 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom)); }
    .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem 1.75rem; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1rem; display: block; }
    h1 { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    p { color: var(--text-2); font-size: 0.9375rem; margin-bottom: 1.5rem; }
    a.btn { display: inline-block; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; font-size: 0.9375rem; padding: 0.625rem 1.25rem; border-radius: 0.625rem; }
    a.btn:hover { filter: brightness(1.05); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ispmb" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#6d88f6"/><stop offset="1" stop-color="#2f4ccc"/></linearGradient><linearGradient id="ispmd" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#16224d"/><stop offset="1" stop-color="#0a1130"/></linearGradient><clipPath id="ispmc"><circle cx="32" cy="32" r="30" fill="#000"/></clipPath><filter id="ispms" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.35"/></filter><radialGradient id="ispmh" cx="0.3" cy="0.22" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#ispmb)"/><path d="M32 2A11 15 0 0 1 32 32A11 15 0 0 0 32 62A30 30 0 0 1 32 2Z" fill="#1e35a6" fill-opacity="1" filter="url(#ispms)" clip-path="url(#ispmc)" transform="translate(2.4 1.4)"/><path d="M32 2A11 15 0 0 1 32 32A11 15 0 0 0 32 62A30 30 0 0 1 32 2Z" fill="url(#ispmd)"/><circle cx="32" cy="32" r="30" fill="url(#ispmh)"/><path d="M32 2A11 15 0 0 1 32 32A11 15 0 0 0 32 62" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.2" clip-path="url(#ispmc)" transform="translate(0.9 0)"/><path d="M26.98 3.54A28.9 28.9 0 0 0 4.84 41.88" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/><path d="M37.02 60.46A28.9 28.9 0 0 0 59.16 22.12" fill="none" stroke="#070c22" stroke-opacity="0.495" stroke-width="1.5" stroke-linecap="round"/><circle cx="32" cy="32" r="29.1" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2"/></svg>
    <h1>You’re offline</h1>
    <p>iSpend needs a connection to show your accounts. Check your network and try again.</p>
    <a class="btn" href="/index.html">Try again</a>
  </main>
</body>
</html>
