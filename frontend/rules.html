<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f8">
  <title>Rules · iSpend</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/rules.css">
</head>
<body>
  <main id="main" class="main--wide main">
    <div class="page-head">
      <div><h1>Rules</h1><div class="page-sub">Rules run top to bottom on every import; the first match wins.</div></div>
      <div class="page-actions">
        <div class="input-group rules-search"><span class="ico-wrap"></span><input id="rule-search" class="input" placeholder="Filter rules…" aria-label="Filter rules"></div>
        <button type="button" class="btn btn-secondary" data-act="run-all" title="Apply all active rules to uncategorized transactions">Run all rules</button>
        <button type="button" class="btn btn-primary" data-act="new-rule">New rule</button>
      </div>
    </div>
    <div id="rules-error"></div>
    <div class="card rules-card">
      <div class="rules-head"><span></span><span class="rh-prio">#</span><span>Condition</span><span></span><span>Then</span><span class="rh-hits">Hits</span><span class="rh-on">On</span><span></span></div>
      <ol class="rule-list" id="rule-list" aria-label="Rules"></ol>
    </div>
    <p class="hint mt-3">Drag the handle or press <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> on a row to reorder. Changes save automatically.</p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pickers.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pages/rules.js"></script>
</body>
</html>
