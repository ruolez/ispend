<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f8">
  <title>Transactions · iSpend</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/transactions.css">
</head>
<body>
  <main id="main" class="main main--wide">
    <div class="page-head">
      <div><h1>Transactions</h1><div class="page-sub" id="tx-sub">Every charge across your accounts.</div></div>
      <div class="page-actions">
        <button type="button" class="btn btn-primary" id="btn-add"></button>
        <a class="btn btn-secondary" id="btn-export" href="/api/transactions/export" download></a>
        <button type="button" class="btn btn-ghost btn-icon" id="btn-density" title="Toggle density"></button>
      </div>
    </div>
    <div class="tbl-toolbar" id="tx-toolbar">
      <button type="button" class="btn btn-secondary" id="f-range"></button>
      <button type="button" class="btn btn-secondary" id="f-accounts"></button>
      <button type="button" class="btn btn-secondary" id="f-categories"></button>
      <div class="seg" id="f-status" role="group" aria-label="Status"></div>
      <div class="input-group tx-search"><span class="ico-wrap"></span><input class="input input-sm" id="f-q" type="search" placeholder="Search description, merchant, notes…" autocomplete="off"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="f-clear" hidden>Clear filters</button>
    </div>
    <div class="tbl-summary" id="tx-summary"></div>
    <div class="tbl-wrap tx-wrap" id="tx-wrap">
      <table class="tbl tbl-tx" id="tx-table" role="grid">
        <thead><tr>
          <th class="col-check"><input type="checkbox" class="check" id="tx-check-all" aria-label="Select all loaded"></th>
          <th class="col-date sortable" data-sort="date">Date</th>
          <th class="col-merchant sortable" data-sort="merchant">Merchant</th>
          <th class="col-cat">Category</th>
          <th class="col-acct">Account</th>
          <th class="col-amt right sortable" data-sort="amount">Amount</th>
          <th class="col-actions"></th>
        </tr></thead>
        <tbody id="tx-body"></tbody>
      </table>
      <div class="tbl-sentinel" id="tx-sentinel"></div>
      <div id="tx-foot"></div>
    </div>
    <div class="sr-only" aria-live="polite" id="tx-live"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pickers.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pages/transactions.js"></script>
</body>
</html>
