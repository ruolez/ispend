<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f6f8">
  <title>Review · iSpend</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="iSpend">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/js/theme.js"></script>
  <script src="/js/pwa.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/review.css">
</head>
<body>
  <main id="main" class="main main--narrow">
    <div class="page-head">
      <div><h1>Review</h1><div class="page-sub">Charges that still need a home. One answer covers everything from the same shop.</div></div>
    </div>
    <div class="rv-toolbar">
      <div class="seg" id="rv-mode" aria-label="Mode">
        <button type="button" class="seg-btn active" data-mode="merchant">By merchant</button>
        <button type="button" class="seg-btn" data-mode="single">One by one</button>
        <button type="button" class="seg-btn" data-mode="transfers">Transfers<span class="seg-count" id="rv-pair-count" hidden></span></button>
      </div>
      <div class="rv-toolbar-actions">
        <button type="button" class="btn btn-secondary" id="btn-focus" aria-pressed="false" aria-label="Focus mode" data-tip="Show one card at a time (F)"></button>
        <button type="button" class="btn btn-secondary" id="btn-accept-all" hidden></button>
        <button type="button" class="btn btn-secondary" id="btn-ai" hidden></button>
        <button type="button" class="btn btn-secondary" id="btn-pair-all" hidden></button>
      </div>
      <button type="button" class="btn btn-icon btn-secondary phone-only" id="btn-rv-more" aria-label="More review actions" aria-haspopup="menu"></button>
    </div>
    <div class="rv-progress card" id="rv-progress"></div>
    <div id="rv-list" class="rv-list"></div>
    <div class="sr-only" aria-live="polite" id="rv-live"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pickers.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pages/review.js"></script>
</body>
</html>
