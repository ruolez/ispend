<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f6f8">
  <title>Import · iSpend</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="iSpend">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/js/theme.js"></script>
  <script src="/js/pwa.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/import.css">
</head>
<body>
  <main id="main" class="main">
    <div class="page-head">
      <div><h1>Import statements</h1><div class="page-sub">Upload your statements — spreadsheets, CSVs or PDFs. If a PDF is only a scan, iSpend reads the words off it.</div></div>
    </div>
    <div class="stepper" id="stepper" aria-label="Import progress">
      <div class="step active" data-step="upload"><span class="step-num">1</span>Upload</div><span class="step-line"></span>
      <div class="step" data-step="review"><span class="step-num">2</span>Review</div><span class="step-line"></span>
      <div class="step" data-step="done"><span class="step-num">3</span>Done</div>
    </div>
    <section id="step-upload"></section>
    <section id="step-review" hidden></section>
    <section id="step-done" hidden></section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pickers.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pages/import.js"></script>
</body>
</html>
