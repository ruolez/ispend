# Mounted only behind the shared host proxy (docker-compose.proxy.yml). The container
# port is bound to loopback, so the only possible peer is that proxy (seen here as the
# Docker bridge gateway) and its X-Real-IP can be trusted. Without this every request
# appears to come from one address and the per-IP limit_req zones would throttle all
# visitors as a single client.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
