# Login attempts per client IP; the burst absorbs a few quick retries, then 1 request / 6 s.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=reset:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=billing:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching anywhere: the vanilla-JS frontend ships without cache busting.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Statement uploads (scanned PDFs can run 5-15 MB).
    client_max_body_size 26m;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many login attempts. Wait a minute and try again."}';
    }

    # A location with its own add_header drops the server-level ones, so nosniff is repeated here.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Whole-application archives: multi-GB upload, and a download nginx serves itself so a
    # gunicorn thread is not held for the duration. ^~ wins over the generic /api/ prefix.
    # No trailing slash: a prefix location ending in "/" with proxy_pass makes nginx 301 the
    # slash-less URI, which would break the collection endpoint at /api/admin/backup.
    location ^~ /api/admin/backup {
        client_max_body_size 4g;
        client_body_timeout 600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://backend:5000;
    }

    # Served only via X-Accel-Redirect from the backup download endpoint.
    location /protected/ {
        internal;
        alias /protected/;
    }

    # The login 429 body is asserted by qa/e2e/ratelimit.py, so these get their own wording.
    location @rate_limited_generic {
        default_type application/json;
        return 429 '{"error":"Too many requests. Wait a minute and try again."}';
    }

    location = /api/auth/signup {
        limit_req zone=signup burst=5 nodelay;
        error_page 429 = @rate_limited_generic;
        proxy_pass http://backend:5000;
    }
    location = /api/auth/password/forgot {
        limit_req zone=reset burst=5 nodelay;
        error_page 429 = @rate_limited_generic;
        proxy_pass http://backend:5000;
    }
    location = /api/auth/password/reset {
        limit_req zone=reset burst=5 nodelay;
        error_page 429 = @rate_limited_generic;
        proxy_pass http://backend:5000;
    }
    location = /api/auth/email/resend {
        limit_req zone=reset burst=3 nodelay;
        error_page 429 = @rate_limited_generic;
        proxy_pass http://backend:5000;
    }

    # Stripe signs the exact request bytes, so nothing here may touch the body. Deliberately in
    # NO limit_req zone: Stripe retries in bursts and would read a 429 as a hard failure.
    location = /api/billing/webhook {
        client_max_body_size 1m;
        proxy_pass http://backend:5000;
    }

    location ~ ^/api/billing/(checkout|portal|refresh)$ {
        limit_req zone=billing burst=10 nodelay;
        error_page 429 = @rate_limited_generic;
        proxy_pass http://backend:5000;
    }

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://backend:5000;
    }

    location /api/ {
        proxy_pass http://backend:5000;
    }

    location = /favicon.ico { access_log off; return 204; }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
