# Login attempts per client IP; the burst absorbs a few quick retries, then 1 request / 6 s.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching anywhere: the vanilla-JS frontend ships without cache busting.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Statement uploads (scanned PDFs can run 5-15 MB).
    client_max_body_size 26m;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many login attempts. Wait a minute and try again."}';
    }

    # A location with its own add_header drops the server-level ones, so nosniff is repeated here.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://backend:5000;
    }

    location /api/ {
        proxy_pass http://backend:5000;
    }

    location = /favicon.ico { access_log off; return 204; }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
